# ---- KassaPro Backend — Render deploy sozlamalari ----
# Render'da: Blueprint (New +) yoki backend/ papirasini Root Directory qilib Web Service yarating.

services:
  - type: web
    name: kassapro-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn smartkassa.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: smartkassa.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartkassa-1.onrender.com,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: kassapro-db
          property: connectionString
    # Telegram bot (secretlar dashboard'da o'rnatiladi, GitHub'ga YOZILMAYDI):
    #   TELEGRAM_BOT_TOKEN      — bot token (api.telegram.org)
    #   TELEGRAM_ADMIN_CHAT_ID  — yangi ariza xabarnomasi boradigan chat ID
    #   TELEGRAM_WEBHOOK_SECRET — webhook'ni himoyalash (ixtiyoriy, tavsiya)
    #   PUBLIC_URL              — webhook URL avto-o'rnatish uchun (mas. https://smartkassa.onrender.com)

databases:
  - name: kassapro-db
    plan: free
    databaseName: kassapro
    user: kassapro
