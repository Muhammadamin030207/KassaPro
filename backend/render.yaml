# ---- KassaPro Backend — Render deploy sozlamalari ----
# Render'da: Blueprint (New +) yoki backend/ papirasini Root Directory qilib Web Service yarating.

services:
  - type: web
    name: kassapro-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn smartkassa.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: smartkassa.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kassapro.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: kassapro-db
          property: connectionString

databases:
  - name: kassapro-db
    plan: free
    databaseName: kassapro
    user: kassapro
